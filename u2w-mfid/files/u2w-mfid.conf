# U2W mfid: the dongle's MFi coprocessor served over TCP for LIVI's "MFi Host" setting
# (wired CarPlay on a Mac: Settings -> MFi -> MFi Host = 192.168.7.1). Read by
# /etc/init.d/u2w-mfid; restart it after a change.
#
# The chip is a signing oracle. By default it is reachable only from the Mac on the USB NCM
# link: mfid binds to BIND *and* to the interface (SO_BINDTODEVICE), and refuses to start when
# BIND is not an address of that interface. IFACE empty = the Mac-facing gadget NCM, resolved
# like u2w-usb-debug does it (never the vendor ncm0) and re-resolved after USB re-enumeration.
#
# Exposing it on the access point is a deliberate choice (anyone who has the Wi-Fi password can
# then use the chip):  IFACE=wlan0  BIND=192.168.50.2
# Off until the vendor-overlap release gate (LIVI-LINK-INTEGRATION-PLAN.md V9) has passed on
# hardware: vendor CarPlay authentication and LIVI signing, repeatedly and concurrently.
ENABLED=no
IFACE=
BIND=192.168.7.1
PORT=5000
# Where the coprocessor answers on this unit (MFi 2.0C).
BUS=1
ADDR=0x10
